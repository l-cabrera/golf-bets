<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15803d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Golf Bets</title>
<style>
:root{--bg:#f2f5f0;--card:#fff;--ink:#0f1a12;--mut:#5b6b5f;--line:#dbe3d8;--acc:#15803d;--g:#166534;--gl:#dcfce7;--red:#b91c1c;--rl:#fee2e2;--gold:#92400e;--yl:#fef3c7;--blue:#1d4ed8;--bl:#dbeafe}
@media (prefers-color-scheme:dark){:root{--bg:#0b110d;--card:#142019;--ink:#eef5ef;--mut:#9fb1a3;--line:#26372c;--g:#4ade80;--gl:#123821;--red:#fca5a5;--rl:#3b1414;--gold:#fcd34d;--yl:#3a2e0b;--blue:#93c5fd;--bl:#152a4a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
main{padding:12px 12px 160px;max-width:640px;margin:0 auto}
h2{font-size:20px;margin:6px 2px 10px}
h3{font-size:15px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.mut{color:var(--mut)} .sm{font-size:13px}
nav#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav#tabs button{flex:1;border:0;background:none;padding:9px 0 11px;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px}
nav#tabs button span{font-size:20px}
nav#tabs button.on{color:var(--g)}
nav#tabs .gap{flex:0 0 76px}
body.viewer #mic,body.viewer nav#tabs [data-t=home],body.viewer nav#tabs [data-t=hole],body.viewer nav#tabs .gap{display:none}
body.viewer main{padding-bottom:90px}
.viewbar{background:var(--bl);color:var(--blue);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.live{font-size:13px;margin:8px 0 2px}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc .chip{height:32px;font-size:13px;font-weight:600}
.rules p{margin:6px 0;font-size:15px;line-height:1.45}
.rules table{font-size:14px;margin:6px 0}
.rules td:nth-child(2){color:var(--mut);font-size:13px;text-align:left}
.card[id^=rule-]{scroll-margin-top:12px}
table.sc{table-layout:fixed;font-size:13px;margin-bottom:8px}
table.sc th,table.sc td{text-align:center;padding:4px 0}
table.sc th:first-child,table.sc td:first-child{width:56px;text-align:left}
table.sc th:last-child,table.sc td:last-child{width:34px}
table.sc tr.par td{color:var(--mut)}
table.sc th.curh{color:var(--g);text-decoration:underline}
.sx{display:inline-block;min-width:20px;border-radius:6px;font-weight:700}
.sx.b{background:var(--gl);color:var(--g)}.sx.bb{background:var(--g);color:var(--card)}.sx.o1{background:var(--yl);color:var(--gold)}.sx.o2{background:var(--rl);color:var(--red)}
/* mic sits over the nav gap: two tabs left of it, three right, gap 76px */
#mic{position:fixed;left:calc((100vw - 76px) * 2 / 5 + 38px);transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));border:4px solid var(--bg)!important;width:66px;height:66px;border-radius:50%;border:0;background:var(--acc);color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:7;display:grid;place-items:center}
#mic svg{width:30px;height:30px}
#mic.live{background:#dc2626;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(220,38,38,.2)}}
/* hole */
.hh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hh .nav{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:28px;line-height:1}
.hh .nav:disabled{opacity:.3}
.hc{flex:1;text-align:center}
.hn{font-size:26px;font-weight:800}
.hs{color:var(--mut);font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}
.pill{border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--yl);color:var(--gold)}
.pill.oc{background:var(--bl);color:var(--blue)}
.pc{padding:8px 10px;margin-bottom:8px}
.pt{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.nm{font-weight:800;font-size:17px}
.dots{color:var(--g);font-size:10px;letter-spacing:1px}
.meta{margin-left:auto;color:var(--mut);font-size:12px;white-space:nowrap}
.sr{display:flex;align-items:center;gap:4px}
.stp{width:40px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700;flex:none}
.sv{width:50px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:24px;font-weight:800;flex:none}
.sv.empty{color:var(--mut);font-weight:400}
.sv.b{border-color:var(--g);background:var(--gl);color:var(--g)}
.sv.bb{border-color:var(--g);background:var(--g);color:var(--card)}
.sv.p{border-color:var(--ink)}
.sv.o1{border-color:var(--gold);background:var(--yl);color:var(--gold)}
.sv.o2{border-color:var(--red);background:var(--rl);color:var(--red)}
.fb{height:32px;padding:0 10px;border-radius:999px;border:1px dashed var(--red);background:none;color:var(--red);font-weight:700;font-size:13px;flex:none}
.pu{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.pu .lab{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;padding-right:4px}
.pu>div{display:flex;gap:3px}
.pu .chip{min-width:0;width:32px;height:34px;padding:0;font-size:14px}
.chip{min-width:40px;height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ft{display:inline-flex;align-items:center;gap:4px;background:var(--rl);color:var(--red);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;font-weight:600;border:0}
.ft.auto{padding-right:10px}
.ft.bounty{background:var(--gl);color:var(--g)}
.ft.track{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.bbr{display:grid;grid-template-columns:56px repeat(var(--n,4),minmax(0,1fr));gap:4px}
.bbr .lab{width:auto;font-size:13px;line-height:1.1}
.bbr .chip{min-width:0;padding:0 4px;height:36px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#banner{position:fixed;top:10px;left:12px;right:12px;max-width:616px;margin:0 auto;z-index:12;background:var(--yl);color:var(--gold);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;font-weight:800;font-size:17px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.warn{background:#92400e;color:#fff}
.ft b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.08)}
.bbr{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap}
.bbr .lab{width:62px;font-weight:700}
.step{font-weight:800;margin:14px 0 8px;color:var(--g)}
.big{width:100%;height:52px;border-radius:12px;border:0;background:var(--acc);color:#fff;font-weight:800;font-size:17px;margin-top:4px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase}
tr:last-child td{border-bottom:0}
table.money{font-size:14px}
table.money td:not(:first-child),table.money th:not(:first-child){white-space:nowrap;padding-left:2px;padding-right:2px}
table.money td:first-child{padding-right:6px}
.pos{color:var(--g);font-weight:700} .neg{color:var(--red);font-weight:700}
.seg{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.seg .chip{white-space:nowrap}
.tx{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}
.tx:last-child{border-bottom:0}
.tx .amt{margin-left:auto;font-weight:800}
.jarbig{font-size:34px;font-weight:800;color:var(--gold)}
/* setup */
label.f{display:flex;align-items:center;gap:8px;margin:8px 0}
label.f>span{flex:1}
input[type=text],input[type=number],select{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;min-width:0}
input[type=number]{width:80px}
.prow{display:grid;grid-template-columns:1fr 1fr 70px;gap:6px;margin-bottom:8px;align-items:center}
.hg{display:grid;grid-template-columns:36px 1fr 1fr;gap:4px 6px;align-items:center;font-size:14px}
.hg input{width:100%}
.btn{height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.btn.d{color:var(--red);border-color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* sheet & toast */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));z-index:10;max-height:85vh;overflow:auto;max-width:640px;margin:0 auto}
#sheet .opt{display:flex;width:100%;align-items:center;gap:10px;padding:13px 10px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:16px}
#sheet .opt:disabled{opacity:.45}
#sheet .opt small{margin-left:auto;color:var(--mut)}
.heard{font-size:20px;font-weight:700;min-height:56px;padding:6px 2px}
.vrow{display:flex;gap:6px}
.vrow input{flex:1}
#toast{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;z-index:11;display:flex;gap:10px;align-items:center;max-width:616px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast div{flex:1;font-size:15px}
#toast button{border:0;background:none;color:var(--g2,#4ade80);font-weight:800;padding:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="view"></main>
<button id="mic" data-a="voice" aria-label="Voice log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></button>
<nav id="tabs">
  <button data-a="tab" data-t="home"><span>🏠</span>Home</button>
  <button data-a="tab" data-t="hole"><span>⛳</span>Hole</button>
  <div class="gap"></div>
  <button data-a="tab" data-t="board"><span>📋</span>Board</button>
  <button data-a="tab" data-t="money"><span>💵</span>Money</button>
  <button data-a="tab" data-t="rules"><span>📖</span>Rules</button>
</nav>
<div id="veil" hidden data-a="close"></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<div id="banner" hidden></div>
<script>
'use strict';
const KEY='golfbets.v1';
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const money=n=>(n<-0.004?'−':'')+'$'+(Math.abs(n)%1?Math.abs(n).toFixed(2):Math.abs(n).toFixed(0));
const rel=n=>n===0?'E':(n>0?'+'+n:'−'+(-n));

// Everything you can log on a player. kind: fine → into the jar; bounty → the others pay this player; track → just counted.
// "first" ones only count for the first player per round; later ones are logged at $0.
const FINES={
  gir:{kind:'bounty',label:'First green in regulation',icon:'🎯',first:true,kw:['green in regulation','green in reg','greens in regulation','gir','on in regulation','hit the green in regulation']},
  lost:{kind:'track',label:'Lost ball / OB',icon:'🔍',kw:['lost ball','lost his ball','lost her ball','lost my ball','lost a ball','lost the ball','lost it','out of bounds','ob','o b','never found it','couldn\'t find it']},
  pen:{kind:'track',label:'Penalty stroke',icon:'⚠️',kw:['penalty','penalty stroke','unplayable','took a drop','takes a drop']},
  triplechip:{label:'First triple chip',icon:'🥄',first:true,kw:['triple chip','triple chipped','3 chip','3 chipped']},
  cliche:{label:'Golf cliché',icon:'💬',kw:["you'll find it",'youll find it','you will find it',"that'll work",'thatll work','that will work','happy with that','see it bounce','saw it bounce','cliche','cliché']},
  short:{label:"Short tee shot (didn't pass forward tees)",icon:'🎀',kw:['ladies','ladies tee','forward tee','forward tees','short drive','short tee','short tee shot','red tees','skirt']},
  // keywords must not be ordinary golf talk: no bare "wood" (3 wood), "sand" (sand wedge), "water" (carried the water), "told"
  tree:{label:'First tree strike',icon:'🌳',first:true,kw:['tree','trees','branch','branches','timber']},
  bunker:{label:'First bunker',icon:'🏖️',first:true,kw:['bunker','in the sand','into the sand','found the sand','sand trap','trap','beach']},
  cart:{label:'First cart-path bounce',icon:'🛣️',first:true,kw:['cart path','cart-path','cartpath','path','asphalt','pavement']},
  water:{label:'First ball in water',icon:'💧',first:true,kw:['in the water','into the water','found the water','hit the water','went in the water','in the lake','in the pond','in the creek','in the river','splash','splashed','wet','water ball']},
  tip:{label:'Unsolicited swing tip',icon:'🗣️',kw:['swing tip','tip','tips','tipped','lesson','swing advice','swing thought','keep your head down','keep his head down','keep her head down','head down','coached','coaching']},
  other:{label:'Other fine',icon:'💲',kw:['fine','fined','swear','swore','cursed','cussed']},
};
const FINE_ORDER=Object.keys(FINES);
const BBB=['bingo','bango','bongo'];
// Plain-English rule text, shown on Board and Setup
const JAR_RULES={
  outright:['Best score on a hole, no ties','Whoever has the best score on a hole takes the whole jar. If two or more players tie for best, nobody wins it and the jar keeps growing.'],
  par:['Best score on a hole, no ties, par or better','Like above, but the winner also has to make par or better. Beating everyone with a bogey doesn\'t count.'],
  net:['Best score after handicap strokes, no ties','Same idea, but using each player\'s score after their handicap strokes on that hole, so higher handicaps can win it too.'],
  round:['Most holes won, paid at the end of the round','The jar keeps growing all round. When the last hole is in, whoever won the most holes outright (best score, no ties) takes it all. If that\'s a tie, it rolls over to the next round.'],
};
const fineKind=t=>(FINES[t]&&FINES[t].kind)||'fine';
const HELP={
  net9:s=>`Every 9 holes, each player goes head-to-head against each of the others using their score after handicap strokes. Win a head-to-head and that player pays you ${money(s)}. Tie and no money moves.`,
  ball:s=>`Everyone marks a ball on hole 1. Your ball is out the first time you log a Lost ball / OB. The last player still holding their marked ball collects ${money(s)} from each other player. If everyone loses theirs, whoever held out longest wins. If two or more still have theirs at the end of the round, they split it.`,
  bbb:s=>`3 points on every hole. <b>Bingo</b>: first ball on the green. <b>Bango</b>: closest to the pin once everyone is on. <b>Bongo</b>: first to hole out. Whoever is farthest from the hole always plays first. At the end you collect ${money(s)} for every point you're ahead of each player, and pay the same for every point you're behind.`,
};

const DEF_PARS=[4,4,3,5,4,4,3,4,5], DEF_SI=[1,5,7,3,2,6,9,8,4];
// Known scorecards (par / stroke index per hole)
const COURSES={
  'East Potomac – White':{par:[3,4,4,4,4,3,4,4,4],si:[9,1,8,4,5,6,2,3,7]},
  'Duke University GC':{par:[4,4,4,3,4,4,5,3,5,4,5,3,4,5,3,4,4,4],si:[4,6,10,18,12,8,2,14,16,11,13,15,9,17,5,7,1,3]},
  'UNC Finley GC':{par:[3,4,3,4,4,3,4,5,4,4,4,5,4,3,5,4,3,4],si:[12,6,18,16,2,8,10,14,4,5,17,11,7,15,1,9,13,3]},
  'Preserve at Jordan Lake':{par:[5,4,3,4,4,3,4,4,5,4,3,4,4,5,4,5,3,4],si:[7,3,13,5,11,17,15,1,9,2,16,10,8,12,14,4,18,6]},
  'Hillandale GC':{par:[4,5,4,3,4,4,3,4,4,4,4,4,4,5,3,4,3,5],si:[13,9,1,15,17,5,11,7,3,4,6,12,2,18,10,14,8,16]},
};
// 18-hole cards can also be played as a 9 (strokes go by SI rank within the nine)
for(const [k,c] of Object.entries({...COURSES}))if(c.par.length===18){
  COURSES[k+' (front 9)']={par:c.par.slice(0,9),si:c.si.slice(0,9)};
  COURSES[k+' (back 9)']={par:c.par.slice(9),si:c.si.slice(9)};
}
function mkRound(name,n,prev){
  const holes=Array.from({length:n},(_,i)=>({par:DEF_PARS[i%9],si:n===18?DEF_SI[i%9]*2-(i<9?1:0):DEF_SI[i]}));
  const c=COURSES[name];if(c&&c.par.length===n)c.par.forEach((p,i)=>holes[i]={par:p,si:c.si[i]});
  return {id:uid(),name,date:new Date().toISOString().slice(0,10),holes,
    stakes:prev?{gir:1,ball:1,...prev.stakes}:{fine:1,net9:5,bbbPt:1,oneClub:5,gir:1,ball:1},
    games:prev?{ball:true,...prev.games,oneClubHole:null}:{net9:true,bbb:true,ball:true,oneClubHole:null},
    jarRule:prev?prev.jarRule:'outright',scores:{},putts:{},bbb:[],cur:0};
}
function mkState(){
  const players=['Lautaro','Ryan','Player 3','Player 4'].map((n,i)=>({id:'p'+(i+1),name:n,aliases:'',hcp:9}));
  const r=mkRound('East Potomac – White',9);
  return {v:1,players,meId:'p1',hrule:{down:0.5},trip:{stringStake:5,stringNet:true},stringNetSet:1,rounds:[r],cur:r.id,events:[],tab:'home'};
}
// ?view=<id> opens a read-only live copy of someone's trip; it never reads or writes this phone's own data
const VIEW=new URLSearchParams(location.search).get('view');
let S=null;
if(!VIEW)try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||S.v!==1) S=mkState();
if(VIEW)S.tab='board';
// phones that opened v1 have the placeholder card on an untouched first round: swap in White
{const r0=S.rounds[0];if(r0&&r0.name==='East Potomac'&&!Object.keys(r0.scores).length&&r0.holes.every((h,i)=>h.par===DEF_PARS[i]&&h.si===DEF_SI[i])){r0.name='East Potomac – White';const c=COURSES[r0.name];r0.holes=c.par.map((p,i)=>({par:p,si:c.si[i]}))}}
// one-time: the Unbroken String now counts handicap strokes by default (the Settings toggle still wins afterwards)
if(!S.stringNetSet){S.trip.stringNet=true;S.stringNetSet=1}
function save(){if(VIEW)return;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}queuePush()}
const round=()=>S.rounds.find(r=>r.id===S.cur)||S.rounds[0];
// round shown on Board/Money (can be a past one); the round being played stays S.cur
const viewRound=()=>S.rounds.find(r=>r.id===S.boardRound)||round();
const pname=id=>id==='JAR'?'🫙 Jar':(S.players.find(p=>p.id===id)||{}).name||'?';
const sc=(r,p,i)=>(r.scores[p]||[])[i]??null;
const pt=(r,p,i)=>(r.putts[p]||[])[i]??null;
function setArr(obj,p,i,v,n){if(!obj[p])obj[p]=Array(n).fill(null);obj[p][i]=v}

// ---------- engine: everything derived from raw scores + events, in play order ----------
function compute(){
  const P=S.players.map(p=>p.id),H=S.hrule,ledger=[],R={},amt=new Map();
  const hc={};S.players.forEach(p=>hc[p.id]=+p.hcp||0);
  const str={};P.forEach(p=>str[p]={cur:0,best:0});
  let jar=0;
  for(const r of S.rounds){
    const n=r.holes.length,fine=+r.stakes.fine||0;
    const X={segs:[],recv:{},fines:{},bbb:{},firsts:{},firstHole:{},oneClub:null,ball:null,jarWins:[],tot:{},threePutts:{},lost:{},pen:{},won:{},complete:true};
    R[r.id]=X;
    P.forEach(p=>{X.recv[p]=Array(n).fill(0);X.fines[p]=0;X.bbb[p]=0;X.threePutts[p]=0;X.lost[p]=0;X.pen[p]=0;X.won[p]=0;X.tot[p]={gross:0,net:0,par:0,thru:0}});
    const evs=S.events.filter(e=>e.r===r.id).sort((a,b)=>a.h-b.h||a.t-b.t);
    const gir=+(r.stakes.gir??1)||0;
    for(const e of evs){const f=FINES[e.type],k=fineKind(e.type);let a=k==='track'?0:k==='bounty'?gir:fine;
      if(f&&f.first){if(X.firsts[e.type])a=0;else{X.firsts[e.type]=e.p;X.firstHole[e.type]=e.h}}amt.set(e.id,a)}
    for(let s=0;s*9<n;s++){
      const a=s*9,b=Math.min(n,a+9),idx=[];for(let i=a;i<b;i++)idx.push(i);
      const rank={};[...idx].sort((x,y)=>r.holes[x].si-r.holes[y].si).forEach((i,k)=>rank[i]=k+1);
      const seg={a,b,hcp:{},strokes:{},gross:{},net:{},par:0,complete:true,delta:{},after:{}};
      idx.forEach(i=>seg.par+=r.holes[i].par);
      P.forEach(p=>{
        seg.hcp[p]=hc[p];const st=Math.round(hc[p]);seg.strokes[p]=st;
        idx.forEach(i=>X.recv[p][i]=Math.floor(st/idx.length)+(rank[i]<=st%idx.length?1:0));
      });
      for(const i of idx){
        const par=r.holes[i].par;
        for(const e of evs)if(e.h===i&&X.fines[e.p]!=null){
          const a2=amt.get(e.id),k=fineKind(e.type);
          if(k==='track'){X[e.type][e.p]++;continue}
          if(!(a2>0))continue;
          if(k==='bounty'){P.filter(p=>p!==e.p).forEach(p=>ledger.push({r:r.id,from:p,to:e.p,amt:a2,cat:'First GIR'}));continue}
          jar+=a2;X.fines[e.p]+=a2;ledger.push({r:r.id,from:e.p,to:'JAR',amt:a2,cat:'Fines'});
        }
        P.forEach(p=>{if(pt(r,p,i)>=3&&fine>0){jar+=fine;X.fines[p]+=fine;X.threePutts[p]++;ledger.push({r:r.id,from:p,to:'JAR',amt:fine,cat:'Fines'})}});
        const g={};let all=true;
        P.forEach(p=>{
          const v=sc(r,p,i);if(v==null){all=false;return}
          g[p]=v;const net=v-X.recv[p][i],T=X.tot[p];T.gross+=v;T.net+=net;T.par+=par;T.thru++;
          const val=S.trip.stringNet?net:v;
          if(val>=par+2)str[p].cur=0;else{str[p].cur++;if(str[p].cur>str[p].best)str[p].best=str[p].cur}
        });
        if(!all)X.complete=false;
        if(all&&P.length){
          const use={};P.forEach(p=>use[p]=r.jarRule==='net'?g[p]-X.recv[p][i]:g[p]);
          const m=Math.min(...P.map(p=>use[p])),w=P.filter(p=>use[p]===m);
          if(w.length===1)X.won[w[0]]++;
          if(r.jarRule!=='round'&&w.length===1&&(r.jarRule!=='par'||g[w[0]]<=par)){
            X.jarWins.push({h:i,p:w[0],amt:jar});
            if(jar>0)ledger.push({r:r.id,from:'JAR',to:w[0],amt:jar,cat:'Jar'});
            jar=0;
          }
        }
        const bb=r.bbb[i]||{};BBB.forEach(k=>{if(bb[k]&&X.bbb[bb[k]]!=null)X.bbb[bb[k]]++});
      }
      P.forEach(p=>{let G=0,N=0,c=true;idx.forEach(i=>{const v=sc(r,p,i);if(v==null)c=false;else{G+=v;N+=v-X.recv[p][i]}});seg.gross[p]=G;seg.net[p]=N;if(!c)seg.complete=false});
      if(seg.complete&&P.length){
        if(r.games.net9&&+r.stakes.net9>0)pairFlat(P,p=>-seg.net[p],+r.stakes.net9,r.id,'Net 9 match',ledger);
        P.forEach(p=>{
          const d=seg.net[p]-seg.par;
          // only ever cut: beating net par lowers it, a bad 9 never raises it
          let delta=d<0?d*H.down:0;delta=Math.round(delta*10)/10;
          seg.delta[p]=delta;hc[p]=Math.max(0,Math.round((hc[p]+delta)*10)/10);seg.after[p]=hc[p];
        });
      }
      X.segs.push(seg);
    }
    if(r.jarRule==='round'&&X.complete&&P.length){
      const m=Math.max(...P.map(p=>X.won[p])),w=P.filter(p=>X.won[p]===m);
      if(m>0&&w.length===1){X.jarWins.push({h:n-1,p:w[0],amt:jar,end:true});if(jar>0)ledger.push({r:r.id,from:'JAR',to:w[0],amt:jar,cat:'Jar'});jar=0}
    }
    if(r.games.bbb&&+r.stakes.bbbPt>0)for(let x=0;x<P.length;x++)for(let y=x+1;y<P.length;y++){
      const d=(X.bbb[P[x]]-X.bbb[P[y]])*r.stakes.bbbPt;
      if(d>0)ledger.push({r:r.id,from:P[y],to:P[x],amt:d,cat:'Bingo Bango Bongo'});
      else if(d<0)ledger.push({r:r.id,from:P[x],to:P[y],amt:-d,cat:'Bingo Bango Bongo'});
    }
    // Longest ball: your marked ball is out at your first Lost ball / OB; last one still holding theirs wins.
    // Everyone out → whoever lost theirs latest wins. Several still in at the end of the round → they split it.
    if(r.games.ball){
      const out={};
      for(const e of evs)if(e.type==='lost'&&X.fines[e.p]!=null&&!out[e.p])out[e.p]={h:e.h,t:e.t};
      const alive=P.filter(p=>!out[p]);
      let w=null;
      if(alive.length===1||(alive.length>1&&X.complete))w=alive;
      else if(!alive.length){const last=P.reduce((a,p)=>!a||out[p].h>out[a].h||(out[p].h===out[a].h&&out[p].t>out[a].t)?p:a,null);w=[last]}
      X.ball={out,alive,w};
      const stake=+(r.stakes.ball??1)||0;
      if(w&&w.length<P.length&&stake>0)P.filter(p=>!w.includes(p)).forEach(l=>w.forEach(wp=>ledger.push({r:r.id,from:l,to:wp,amt:r2(stake/w.length),cat:'Longest ball'})));
    }
    const oh=r.games.oneClubHole;
    if(oh!=null&&oh!==''&&r.holes[oh]){
      const g={};P.forEach(p=>g[p]=sc(r,p,+oh));
      if(P.every(p=>g[p]!=null)){
        const m=Math.min(...P.map(p=>g[p])),w=P.filter(p=>g[p]===m);
        X.oneClub={w,score:m};
        if(w.length<P.length&&+r.stakes.oneClub>0)P.filter(p=>!w.includes(p)).forEach(l=>w.forEach(wp=>ledger.push({r:r.id,from:l,to:wp,amt:r2(r.stakes.oneClub/w.length),cat:'One-club challenge'})));
      }
    }
  }
  const best=Math.max(0,...Object.values(str).map(s=>s.best));
  const leaders=best>0?Object.keys(str).filter(p=>str[p].best===best):[];
  if(leaders.length&&leaders.length<S.players.length&&+S.trip.stringStake>0)
    Object.keys(str).filter(p=>!leaders.includes(p)).forEach(l=>leaders.forEach(w=>ledger.push({r:'TRIP',from:l,to:w,amt:r2(S.trip.stringStake/leaders.length),cat:'Unbroken String'})));
  return {R,ledger,hc,str,jar,amt,leaders};
}
// every pair: better score wins a flat stake, ties push
function pairFlat(P,score,stake,rid,cat,ledger){
  for(let x=0;x<P.length;x++)for(let y=x+1;y<P.length;y++){
    const a=score(P[x]),b=score(P[y]);
    if(a>b)ledger.push({r:rid,from:P[y],to:P[x],amt:stake,cat});else if(b>a)ledger.push({r:rid,from:P[x],to:P[y],amt:stake,cat});
  }
}
function settle(ledger){
  const bal={};S.players.forEach(p=>bal[p.id]=0);
  ledger.forEach(l=>{bal[l.from]=(bal[l.from]||0)-l.amt;bal[l.to]=(bal[l.to]||0)+l.amt});
  for(const k in bal)bal[k]=r2(bal[k]);
  const cr=[],db=[];for(const k in bal){if(bal[k]>0.004)cr.push([k,bal[k]]);else if(bal[k]<-0.004)db.push([k,-bal[k]])}
  cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);
  const tx=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const a=Math.min(db[i][1],cr[j][1]);tx.push({from:db[i][0],to:cr[j][0],amt:r2(a)});db[i][1]-=a;cr[j][1]-=a;if(db[i][1]<0.005)i++;if(cr[j][1]<0.005)j++}
  return {bal,tx};
}

// the bet sheet: every game, fine and rule, with this round's actual amounts and on/off state
function vRules(){
  const r=viewRound(),st=r.stakes,g=r.games,f=+st.fine||0,n=S.players.length-1;
  const on=(b,amt)=>b?`<span class="pill" style="background:var(--gl);color:var(--g)">On${amt!=null?' · '+amt:''}</span>`:'<span class="pill" style="background:var(--bg);color:var(--mut)">Off this round</span>';
  const oh=g.oneClubHole!=null&&g.oneClubHole!=='';
  const sec=(id,icon,title,badge,body)=>`<div class="card" id="rule-${id}"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 style="margin:0">${icon} ${title}</h3>${badge||''}</div><div class="rules">${body}</div></div>`;
  const fineRows=FINE_ORDER.filter(k=>fineKind(k)==='fine').map(k=>{const x=FINES[k];
    return `<tr><td>${x.icon} ${esc(x.label.replace(/^First /,''))}</td><td>${x.first?'first one each round':'every time'}</td><td>${money(f)}</td></tr>`}).join('');
  const toc=[['scoring','Scoring & handicaps'],['jar','Swear jar'],['net9','Net 9 match'],['bbb','Bingo Bango Bongo'],['ball','Longest ball'],['gir','First GIR'],['oneclub','One-club challenge'],['string','Unbroken String'],['tracking','Lost balls & penalties'],['settle','Settling up']];
  return `<h2>Bet sheet</h2>${S.rounds.length>1?roundChips(r.id,'boardRound'):''}
  <div class="sm mut" style="margin-bottom:8px">Amounts and on/off are for <b>${esc(r.name)}</b>. Tap a bet to jump to it.</div>
  <div class="card"><div class="toc">${toc.map(([id,t],i)=>`<button class="chip" data-a="jump" data-id="rule-${id}">${i+1}. ${t}</button>`).join('')}</div></div>
  ${sec('scoring','⛳','Scoring & handicaps','',`
    <p>Everyone's real score goes on the card. Your <b>handicap is strokes per 9 holes</b> (about half your 18-hole handicap), given on the hardest holes of each nine by the card's stroke index (the dots next to your name on the Hole screen). Score minus strokes = your <b>net</b> score.</p>
    <p>After every 9 holes your handicap is recalculated, and it <b>only goes down</b>. Beat your net par by X strokes and it drops by X × ${S.hrule.down} (rounded to 0.1). A bad nine never raises it.</p>`)}
  ${sec('jar','🫙','Swear jar','<span class="pill">'+money(f)+' per fine</span>',`
    <p>Fines go into a shared jar. It carries over between rounds until someone wins it.</p>
    <table><tr><th>Fine</th><th>When</th><th>$</th></tr>${fineRows}<tr><td>⛳ 3-putt</td><td>every time (automatic from putts)</td><td>${money(f)}</td></tr></table>
    <p class="sm mut">"First one each round" fines only cost the first player who does it each round. Later ones are logged but cost $0. The clichés are: "You'll find it", "That'll work", "Happy with that", "I didn't see it bounce". A short tee shot is a drive that doesn't pass the forward tees.</p>
    <p><b>Who wins the jar this round:</b> ${esc(JAR_RULES[r.jarRule||'outright'][0])}. ${esc(JAR_RULES[r.jarRule||'outright'][1])}</p>`)}
  ${sec('net9','🤝','Net 9 match',on(g.net9,money(+st.net9)),`<p>${HELP.net9(+st.net9)}</p><p class="sm mut">An 18-hole round has two separate matches: front 9 and back 9.</p>`)}
  ${sec('bbb','🎯','Bingo Bango Bongo',on(g.bbb,money(+st.bbbPt)+' / point'),`<p>${HELP.bbb(+st.bbbPt)}</p>`)}
  ${sec('ball','⚪','Longest ball (last man standing)',on(g.ball,money(+(st.ball??1))),`<p>${HELP.ball(+(st.ball??1))}</p><p class="sm mut">With ${n+1} players, the winner collects ${money(+(st.ball??1)*n)}.</p>`)}
  ${sec('gir','🟢','First green in regulation',on(true,money(+(st.gir??1))),`<p>The first player each round to reach a green in regulation (on in 1 on a par 3, in 2 on a par 4, in 3 on a par 5) collects ${money(+(st.gir??1))} from each other player, ${money(+(st.gir??1)*n)} total.</p>`)}
  ${sec('oneclub','🏌️','One-club challenge',on(oh,oh?'hole '+(+g.oneClubHole+1)+' · '+money(+st.oneClub):null),`<p>On the chosen hole, everyone plays tee to green <b>and putts</b> with only a 7-iron. Lowest score wins ${money(+st.oneClub)} from each other player. Tied winners split it, and if everyone ties nobody pays.</p>`)}
  ${sec('string','🧵','Unbroken String (whole trip)',on(+S.trip.stringStake>0,money(+S.trip.stringStake)),`<p>Across every round of the trip: the longest run of holes in a row without a double bogey or worse${S.trip.stringNet?', counted <b>after your handicap strokes</b> (a net double breaks it)':', counted on actual strokes'}. At the end of the trip, the leader collects ${money(+S.trip.stringStake)} from each other player. Tied leaders split it.</p>`)}
  ${sec('tracking','🔍','Lost balls & penalties','',`<p>Lost balls / OB and penalty strokes are counted on the Board. They don't cost money by themselves, but a lost ball ends your run in <b>Longest ball</b>. Include penalty strokes in your hole score.</p>`)}
  ${sec('settle','💵','Settling up','',`<p>Every game is netted into one short list of who pays whom (Money tab), per round or for the whole trip. Fines are paid to the jar, and the jar pays out to its winner. Money still in the jar at the end stays in the pot.</p>`)}`;
}
function vMoney(C){
  const scope=S.moneyScope||'round',r=viewRound();
  const led=scope==='trip'?C.ledger:C.ledger.filter(l=>l.r===r.id);
  const {bal,tx}=settle(led);
  const cats=[...new Set(led.map(l=>l.cat))];
  let o=`<h2>Settle up</h2><div class="seg"><button class="chip ${scope==='round'?'on':''}" data-a="scope" data-v="round">One round</button><button class="chip ${scope==='trip'?'on':''}" data-a="scope" data-v="trip">All rounds</button></div>
  ${scope==='round'&&S.rounds.length>1?roundChips(r.id,'boardRound'):''}
  <div class="card"><h3>Who pays whom</h3>${tx.length?tx.map(t=>`<div class="tx"><b>${esc(pname(t.from))}</b> → <b>${esc(pname(t.to))}</b><span class="amt">${money(t.amt)}</span></div>`).join(''):'<div class="mut">All square so far.</div>'}
  ${tx.some(t=>t.to==='JAR')?'<div class="sm mut" style="margin-top:6px">Money to the jar stays in the pot until someone wins it.</div>':''}
  ${scope==='trip'&&C.leaders.length?'<div class="sm mut" style="margin-top:6px">Includes Unbroken String for the current leader. Final once the trip is over.</div>':''}</div>
  <div class="card"><h3>Net by game</h3><table class="money"><tr><th>Game</th>${S.players.map(p=>`<th>${esc(p.name.split(' ')[0])}</th>`).join('')}</tr>
  ${cats.map(c=>{const b={};led.filter(l=>l.cat===c).forEach(l=>{b[l.from]=(b[l.from]||0)-l.amt;b[l.to]=(b[l.to]||0)+l.amt});return `<tr><td>${esc(c)}</td>${S.players.map(p=>{const v=r2(b[p.id]||0);return `<td class="${v>0?'pos':v<0?'neg':''}">${v?money(v):'·'}</td>`}).join('')}</tr>`}).join('')}
  <tr><td><b>Total</b></td>${S.players.map(p=>{const v=bal[p.id]||0;return `<td class="${v>0?'pos':v<0?'neg':''}"><b>${money(v)}</b></td>`}).join('')}</tr></table></div>
  <button class="big" data-a="share">Share summary</button>${VIEW?'':`<div class="card" style="margin-top:10px">${liveBlock()}</div>`}`;
  return o;
}
// a BBB chip tapped off leaves {bingo:null}, so look for an actual pick, not just an entry
const hasData=r=>Object.values(r.scores).some(a=>a.some(v=>v!=null))||S.events.some(e=>e.r===r.id)||r.bbb.some(b=>b&&BBB.some(k=>b[k]));
function mkDraft(){
  const r=round();
  return {course:COURSES[r.name]?r.name:'East Potomac – White',custom:'',holes:9,
    stakes:{ball:1,...r.stakes},games:{net9:r.games.net9,bbb:r.games.bbb,ball:r.games.ball??true,oneClubHole:null},jarRule:r.jarRule};
}
function liveBlock(){
  if(!FB_CONFIG)return'';
  return S.share
    ?`<div class="live mut" id="livestat">${liveStatus()}</div><button class="btn" style="width:100%;margin-top:4px" data-a="shareLive">📤 Send the live link again</button>`
    :`<button class="big" style="background:var(--blue);margin-top:8px" data-a="shareLive">📤 Share live link with the group</button><div class="sm mut" style="margin-top:4px">They see scores, the jar and the money live, read-only, with no app needed.</div>`;
}

// ---------- actions ----------
let undoSnap=null;
function snap(){undoSnap=JSON.stringify(S)}
function commit(){save();render()}
const ACT={
  tab:d=>{S.tab=d.t;commit();scrollTo(0,0)},
  hole:d=>{const r=round();r.cur=Math.max(0,Math.min(r.holes.length-1,r.cur+(+d.d)));commit();scrollTo(0,0)},
  sc:d=>{const r=round(),i=r.cur,par=r.holes[i].par,v=sc(r,d.p,i);let nv;
    if(+d.d===0)nv=v==null?par:v;else nv=v==null?par+(+d.d):v+(+d.d);
    nv=Math.max(1,Math.min(15,nv));setArr(r.scores,d.p,i,nv,r.holes.length);commit()},
  pu:d=>{const r=round(),i=r.cur,v=pt(r,d.p,i);setArr(r.putts,d.p,i,v===+d.v?null:+d.v,r.holes.length);commit()},
  bbb:d=>{const r=round(),i=r.cur;r.bbb[i]=r.bbb[i]||{};r.bbb[i][d.k]=r.bbb[i][d.k]===d.p?null:d.p;commit()},
  fineSheet:d=>openFineSheet(d.p),
  addFine:d=>{snap();const r=round();S.events.push({id:uid(),t:Date.now(),r:r.id,h:r.cur,p:d.p,type:d.ty,note:''});closeSheet();commit();toast(`${pname(d.p)}: ${FINES[d.ty].label}`,true)},
  delEv:d=>{snap();S.events=S.events.filter(e=>e.id!==d.id);commit();toast('Removed',true)},

// ---------- voice: on-device phrase parser (no AI call, instant) ----------
const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12};
const ORDW={first:1,second:2,third:3,fourth:4,fifth:5,sixth:6,seventh:7,eighth:8,ninth:9,tenth:10,eleventh:11,twelfth:12,thirteenth:13,fourteenth:14,fifteenth:15,sixteenth:16,seventeenth:17,eighteenth:18};
const TERMS=[['quadruple bogey',4],['quad',4],['triple bogey',3],['triple',3],['double bogey',2],['double',2],['bogey',1],['par',0],['birdie',-1],['eagle',-2],['albatross',-3]];
// the ways people actually describe Bingo / Bango / Bongo, mapped onto the keywords
const BBB_PHRASES=[
  [/\b(first (1 )?on( the green)?|on (the green )?first|first to the green)\b/g,'bingo'],
  [/\b(closest|nearest)( to the (pin|hole|flag|cup))?\b/g,'bango'],
  [/\b(holed? (it )?out first|first to hole out|first in the hole|in the hole first|in first)\b/g,'bongo'],
];
// capitalised words that are never a misheard player name
const NOT_NAMES=new Set('the and he she they we you no yes yeah yep nope wait okay ok oh hey wow whoa nice great good awesome sweet damn dang shoot man dude bro well alright all hole next everyone everybody bingo bango bongo that this what shot just also then so his her its it lost said told gave hit'.split(' '));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const wre=k=>new RegExp('(^|[^a-z0-9])'+reEsc(k)+'(?=$|[^a-z0-9])');
const isFiller=s=>/^[\s,&]*((and|plus|with|also|too|&)[\s,]*)*$/.test(s);
function norm(text){
  let t=' '+text.toLowerCase().replace(/[’`]/g,"'").replace(/[.,!?;:"]/g,' ').replace(/\s+/g,' ')+' ';
  t=t.replace(/\b(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve)\b/g,w=>NUMW[w]);
  return t;
}
// exact names and nicknames only: near-misses ("make" for Mike) are not guessed, the app asks instead
function findMentions(t){
  const out=[];
  for(const p of S.players){
    const terms=[p.name,p.name.split(' ')[0],...String(p.aliases||'').split(',')].map(x=>x.trim().toLowerCase()).filter(x=>x.length>1);
    for(const term of new Set(terms)){const re=new RegExp('\\b'+reEsc(term)+"('s)?\\b",'g');let m;while((m=re.exec(t)))out.push({p:p.id,s:m.index,e:m.index+m[0].length})}
  }
  for(const m of t.matchAll(/[a-z0-9']+/g)){
    if(/^(i|i'm|im|me|my|myself|i've|i'd|mine)$/.test(m[0]))out.push({p:S.meId,s:m.index,e:m.index+m[0].length});
    if(/^(everyone|everybody)$/.test(m[0]))out.push({p:'*',s:m.index,e:m.index+m[0].length});
  }
  out.sort((a,b)=>a.s-b.s||(b.e-b.s)-(a.e-a.s));
  const res=[];for(const m of out){const last=res[res.length-1];if(last&&m.s<last.e)continue;res.push(m)}
  return res;
}
// speech engines capitalise names, so a capitalised unknown word is probably a misheard player
function guessName(text){
  const known=new Set(S.players.flatMap(p=>[p.name.toLowerCase(),...String(p.aliases||'').toLowerCase().split(',').map(x=>x.trim())]));
  for(const w of text.match(/[A-Za-z']+/g)||[]){const lw=w.toLowerCase().replace(/'s$/,'');
    if(/^[A-Z]/.test(w)&&lw.length>=3&&!NOT_NAMES.has(lw)&&!known.has(lw)&&!FINE_ORDER.some(k=>FINES[k].kw.includes(lw))&&!TERMS.some(([x])=>x===lw))return lw}
  return null;
}
function parseSeg(seg,par){
  const a={fines:[],putts:null,score:null};let s=' '+seg+' ';
  let m=s.match(/(?:^|\s)(\d)\s*-?\s*putt(?:s|ed|ing)?\b/)||s.match(/\bputts?\s+(\d)\b/);
  if(m){a.putts=Math.min(4,+m[1]);s=s.replace(m[0],' ')}
  for(const k of FINE_ORDER){if(k==='other')continue;for(const kw of FINES[k].kw){const re=wre(kw);if(re.test(s)){a.fines.push(k);s=s.replace(re,'$1 ');break}}}
  if(!a.fines.length&&FINES.other.kw.some(kw=>wre(kw).test(s)))a.fines.push('other');
  for(const [w,off] of TERMS){if(wre(w).test(s)){a.score=par+off;s=s.replace(wre(w),'$1 ');break}}
  if(a.score==null){const n=s.match(/(?:^|[^a-z0-9])(1[0-5]|[1-9])(?![0-9])/);if(n)a.score=+n[1]}
  return a;
}
const segHas=a=>a.fines.length||a.putts!=null||a.score!=null;
function parseUtterance(text){
  const r=round(),n=r.holes.length;let t=norm(text);let h=r.cur;const acts=[],warn=[];
  if(/\b(next hole|go to next)\b/.test(t)&&!/\bhole \d/.test(t))return{acts:[{k:'nav',h:Math.min(n-1,r.cur+1)}],warn};
  if(/\b(previous hole|last hole|go back)\b/.test(t))return{acts:[{k:'nav',h:Math.max(0,r.cur-1)}],warn};
  // "hole 7", "7th hole", "seventh hole", and the way people actually say it: "on 7", "on the 7th", "on number 7"
  let m=t.match(/\bhole (?:number )?(\d{1,2})\b/)||t.match(/\b(\d{1,2})(?:st|nd|rd|th) hole\b/)||t.match(/\bon (?:the |number )?(\d{1,2})(?:st|nd|rd|th)?\b(?! ?(?:putts?|shot|swing|try|attempt)\b)/);
  if(!m){const o=t.match(/\b(?:on the )?(first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth|thirteenth|fourteenth|fifteenth|sixteenth|seventeenth|eighteenth) hole\b/)||t.match(/\bon the (second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth|thirteenth|fourteenth|fifteenth|sixteenth|seventeenth|eighteenth)\b(?! (?:putts?|shot|swing|try|attempt)\b)/);if(o)m=[o[0],ORDW[o[1]]]}
  if(m&&+m[1]>=1&&+m[1]<=n){h=+m[1]-1;t=t.replace(m[0],' ')}
  for(const [re,k] of BBB_PHRASES)t=t.replace(re,' '+k+' ');
  t=t.replace(/\b(\d+(?:st|nd|rd|th)?|second|third|fourth|fifth|sixth) (shot|swing|attempt|try)\b/g,' ').replace(/\bthe par \d\b/g,' ').replace(/\bon (the )?(tee|green)\b/g,' ');
  const par=r.holes[h].par;
  // "Dave said I didn't see it bounce": only the part before "said" can name who did it
  const sm=t.match(/\b(said|says|saying|goes|yelled|shouted|muttered)\b/);
  const ments=findMentions(sm?t.slice(0,sm.index)+' '.repeat(t.length-sm.index):t);
  // bingo/bango/bongo go to the nearest name, on the side the speaker uses
  const bbbHits=[];
  for(const k of BBB){const re=new RegExp('\\b'+k+'\\b','g');let x;while((x=re.exec(t)))bbbHits.push({k,s:x.index,e:x.index+k.length})}
  if(bbbHits.length){
    if(ments.length){
      const after=Math.min(...bbbHits.map(b=>b.s))<ments[0].s;
      for(const b of bbbHits){
        const c=after?ments.find(mm=>mm.s>=b.e):[...ments].reverse().find(mm=>mm.e<=b.s);
        const pick=c||ments.reduce((x,y)=>Math.min(Math.abs(y.s-b.e),Math.abs(y.e-b.s))<Math.min(Math.abs(x.s-b.e),Math.abs(x.e-b.s))?y:x);
        if(pick.p!=='*')acts.push({k:'bbb',key:b.k,p:pick.p,h});
      }
    }else bbbHits.forEach(b=>acts.push({k:'bbb',key:b.k,p:'?',h}));
    t=t.replace(/\b(bingo|bango|bongo)\b/g,w=>' '.repeat(w.length));
  }
  if(!ments.length){
    const a=parseSeg(t,par);
    if(a.score!=null)acts.push({k:'score',p:'?',h,v:a.score});
    if(a.putts!=null)acts.push({k:'putts',p:'?',h,v:a.putts});
    a.fines.forEach(ty=>acts.push({k:'fine',p:'?',h,ty}));
    if(!acts.length)return{acts,warn,err:"Didn't catch a name or what happened"};
    return{acts,warn,ask:{cands:[],learn:guessName(text)}};
  }
  const valueFirst=segHas(parseSeg(t.slice(0,ments[0].s),par));
  const per=ments.map((mm,k)=>{const seg=valueFirst?t.slice(k?ments[k-1].e:0,mm.s):t.slice(mm.e,k<ments.length-1?ments[k+1].s:t.length);return{mm,seg,a:parseSeg(seg,par)}});
  // "Lautaro and Ryan 6" / "6 for Lautaro and Ryan": a name joined by "and" shares its neighbour's result
  if(valueFirst){for(let k=1;k<per.length;k++)if(!segHas(per[k].a)&&isFiller(per[k].seg))per[k].a=per[k-1].a}
  else{for(let k=per.length-2;k>=0;k--)if(!segHas(per[k].a)&&isFiller(per[k].seg))per[k].a=per[k+1].a}
  // a fine in a sentence naming two people ("Mike gave Dave a swing tip") is ambiguous: ask instead of guessing
  const dist=[...new Set(per.map(x=>x.mm.p).filter(p=>p!=='*'))];
  const fineTypes=per.flatMap(x=>x.a.fines);
  const empties=per.filter(x=>!segHas(x.a)&&!isFiller(x.seg));
  let ask=null;
  if(dist.length>=2&&fineTypes.length&&(empties.length||fineTypes.length!==new Set(fineTypes).size)){
    [...new Set(fineTypes)].forEach(ty=>acts.push({k:'fine',p:'?',h,ty}));
    per.forEach(x=>x.a={...x.a,fines:[]});
    ask={cands:dist,learn:null};
  }
  // "everyone" means everyone not named on their own in the same sentence ("Ryan par, everyone else bogey")
  const named=new Set(per.map(x=>x.mm.p).filter(p=>p!=='*'));
  for(const x of per){
    const ps=x.mm.p==='*'?S.players.map(p=>p.id).filter(p=>!named.has(p)):[x.mm.p];
    for(const p of ps){
      if(x.a.score!=null)acts.push({k:'score',p,h,v:x.a.score});
      if(x.a.putts!=null)acts.push({k:'putts',p,h,v:x.a.putts});
      x.a.fines.forEach(ty=>acts.push({k:'fine',p,h,ty}));
    }
    if(!segHas(x.a)&&!ask&&!acts.some(a=>a.k==='bbb'&&a.p===x.mm.p))warn.push(pname(x.mm.p));
  }
  if(!acts.length)return{acts,warn,err:"Heard the name, not what happened"};
  return{acts,warn,ask};
}
const describe=a=>a.k==='fine'?FINES[a.ty].icon+' '+FINES[a.ty].label.replace('First ','').replace(/ \(.*\)/,''):a.k==='bbb'?a.key[0].toUpperCase()+a.key.slice(1):a.k==='score'?'a '+a.v:a.v+' putts';
function applyActs(acts,note){
  const r=round(),n=r.holes.length,out=[];
  for(const a of acts){
    if(a.k==='nav'){r.cur=a.h;out.push('Hole '+(a.h+1));continue}
    const nm=pname(a.p),hh=' (h'+(a.h+1)+')';
    if(a.k==='score'){setArr(r.scores,a.p,a.h,a.v,n);out.push(`${nm} ${a.v}`+hh)}
    if(a.k==='putts'){setArr(r.putts,a.p,a.h,a.v,n);out.push(`${nm} ${a.v} putt${a.v===1?'':'s'}`+(a.v>=3?' 🫙':''))}
    if(a.k==='fine'){S.events.push({id:uid(),t:Date.now(),r:r.id,h:a.h,p:a.p,type:a.ty,note});out.push(`${nm}: ${describe(a)}`+hh)}
    if(a.k==='bbb'){r.bbb[a.h]=r.bbb[a.h]||{};r.bbb[a.h][a.key]=a.p;out.push(`${describe(a)}: ${nm}`)}
  }
  return out.join(' · ');
}
// try each speech alternative; prefer one fully understood, then one with a warning, then one that needs "Who?"
function handleUtterance(alts){
  let best=null;
  for(const a of alts){const p=parseUtterance(a),q=p.err?0:p.ask?1:p.warn.length?2:3;if(!best||q>best.q)best={text:a,p,q};if(q===3)break}
  if(!best||best.p.err){showVoice(alts[0]||'',best?best.p.err:'Nothing heard');return}
  if(best.p.ask){askWho(best);return}
  finishVoice(best);
}
function finishVoice(b){
  snap();const msg=applyActs(b.p.acts,b.text);closeSheet();commit();
  if(b.p.warn.length)toast(`⚠️ ${msg}. Didn't catch anything for ${b.p.warn.join(' or ')}, check them.`,true,true);
  else toast('✓ '+msg,true);
}
let PENDING=null;
function askWho(b){

  const what=[...new Set(b.p.acts.filter(a=>a.p==='?').map(describe))].join(', ');
  openSheet(`<h2>Who?</h2><div class="heard">“${esc(b.text)}”</div><div class="mut" style="margin-bottom:6px">Who gets <b>${esc(what)}</b>?</div>
    ${learn?`<label class="f" style="margin:4px 0 8px"><input type="checkbox" id="whoLearn" checked><span>Remember “${esc(learn)}” as this player's nickname</span></label>`:''}
    ${order.map(id=>`<button class="opt" data-a="whoPick" data-p="${id}"><b>${esc(pname(id))}</b></button>`).join('')}
    <button class="opt" data-a="close"><span class="mut">Cancel, log nothing</span></button>`);

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function showVoice(heard,err,live){
  openSheet(`<h2>${live?'Listening…':'Say it or type it'}</h2><div class="heard">${esc(heard||'')}</div>
  ${err?`<div class="neg" style="margin-bottom:8px">${esc(err)}. Fix the text or try again.</div>`:''}

}
function openVoice(){if(SR)startRec();else{showVoice('',"This browser has no speech input. Type instead");setTimeout(()=>$('#vtext')?.focus(),50)}}
function stopRec(){try{rec&&rec.abort()}catch(e){}rec=null;$('#mic').classList.remove('live')}
function startRec(){
  stopRec();rec=new SR();rec.lang='en-US';rec.interimResults=true;rec.maxAlternatives=4;rec.continuous=false;
  let done=false;showVoice('',null,true);$('#mic').classList.add('live');
  rec.onresult=e=>{const res=e.results[e.results.length-1];
    if(res.isFinal){done=true;stopRec();handleUtterance([...res].map(x=>x.transcript))}
    else{const h=$('.heard');if(h)h.textContent=[...e.results].map(x=>x[0].transcript).join(' ')}};
  rec.onerror=e=>{done=true;stopRec();showVoice('',e.error==='not-allowed'?'Microphone permission blocked':e.error==='no-speech'?'Heard nothing':'Mic error: '+e.error)};
  rec.onend=()=>{$('#mic').classList.remove('live');if(!done&&!$('#sheet').hidden&&$('#sheet h2')?.textContent==='Listening…')showVoice('','Heard nothing')};
  try{rec.start()}catch(e){showVoice('','Could not start the mic')}
}

  if(navigator.onLine===false)throw new Error('offline');

  const [A,Au,D]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-database.js')]);
  const app=A.initializeApp(FB_CONFIG);
  fb={auth:Au.getAuth(app),db:D.getDatabase(app),Au,D};
  return fb;
}
// anonymous sign-in: the uid stays on this phone, and the database rules only let that uid change its own link
async function fbUser(){
  const f=await fbInit();
  await new Promise(r=>{const off=f.Au.onAuthStateChanged(f.auth,()=>{off();r()})});
  return f.auth.currentUser||(await f.Au.signInAnonymously(f.auth)).user;

function ago(ms){const s=Math.max(0,Math.round((Date.now()-ms)/1000));return s<60?'just now':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago'}
